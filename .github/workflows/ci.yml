name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的重复推送只保留最新一次校验
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 第三方 action 固定到 commit SHA（v4 标签对应提交），避免标签被重定向后执行非预期代码
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      # 含 vue-tsc 类型检查、部署版构建与单文件构建
      - name: 构建
        run: pnpm build
