name: CI

# 只在推 tag 时运行：部署走 Vercel，push main / PR 都不跑 CI
on:
  push:
    tags:
      - "v*" # 例：v100.2.0
      - "[0-9]*" # 例：100.1.0

# 同一个 ref 的重复推送只保留最新一次校验
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读工作流：显式声明最小权限，避免默认 GITHUB_TOKEN 权限过宽
permissions:
  contents: read

jobs:
  verify:
    name: lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 第三方 action 固定到 commit SHA（v4 标签对应提交），避免标签被重定向后执行非预期代码
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 要求 Node ^22.22.2 || ^24.15.0 || >=26，Node 20 下 vitest 起不了 worker
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      # 含 vue-tsc 类型检查、部署版构建与单文件构建
      - name: 构建
        run: pnpm build
