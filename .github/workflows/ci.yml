name: CI

# 只在推 tag 时运行：部署走 Vercel，push main / PR 都不跑 CI
on:
  push:
    tags:
      - "v*" # 例：v100.3.0
      - "[0-9]*" # 例：100.3.0

# 同一个 ref 的重复推送只保留最新一次校验
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读工作流：显式声明最小权限，避免默认 GITHUB_TOKEN 权限过宽
permissions:
  contents: read

jobs:
  verify:
    name: lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 第三方 action 固定到 commit SHA（标签对应提交），避免标签被重定向后执行非预期代码
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # 与 package.json 的 packageManager 保持一致
          version: 12.21.0

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 要求 Node ^22.22.2 || ^24.15.0 || >=26；推荐版本见 .nvmrc
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      # 含 vue-tsc 类型检查与生产构建
      - name: 构建
        run: pnpm build
